<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6dce3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="東京箱根" />
  <title>TOKYO × HAKONE 2026</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PRIVATE TRAVEL PWA · V1.9</div>
        <h1 id="pageTitle">TOKYO × HAKONE</h1>
      </div>
      <div class="topbar-actions">
        <span id="networkBadge" class="status-pill">● 線上</span>
        <button id="installBtn" class="icon-btn" hidden aria-label="安裝 App">＋</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-item active" data-view="home"><span class="tokyo-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 12h20l-3-5H9zM8 13v12h16V13M13 17h6v8M5 25h22"/></svg></span><small>首頁</small></button>
      <button class="nav-item" data-view="trip"><span class="tokyo-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l2 5-1 3 2 3-1 3 2 4-2 8h-4l-2-8 2-4-1-3 2-3-1-3zM11 29h10M10 21h12"/></svg></span><small>行程</small></button>
      <button class="nav-item" data-view="map"><span class="tokyo-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l3 8h-2l4 15h-3l-2-5-2 5h-3l4-15h-2zM10 13h12M9 18h14M8 26h16"/></svg></span><small>地圖</small></button>
      <button class="nav-item" data-view="more"><span class="tokyo-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 12c0-5 4-8 9-8s9 3 9 8v9c0 4-4 7-9 7s-9-3-9-7z"/><path d="M10 19h12v5H10zM11 11h10"/></svg></span><small>更多</small></button>
    </nav>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
