<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2a47" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="東京箱根" />
  <title>TOKYO × HAKONE 2026</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PRIVATE TRAVEL PWA · V1.6</div>
        <h1 id="pageTitle">TOKYO × HAKONE</h1>
      </div>
      <div class="topbar-actions">
        <span id="networkBadge" class="status-pill">● 線上</span>
        <button id="installBtn" class="icon-btn" hidden aria-label="安裝 App">＋</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-item active" data-view="home"><span>⌂</span><small>首頁</small></button>
      <button class="nav-item" data-view="trip"><span>▣</span><small>行程</small></button>
      <button class="nav-item" data-view="map"><span>⌖</span><small>地圖</small></button>
      <button class="nav-item" data-view="more"><span>☰</span><small>更多</small></button>
    </nav>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
